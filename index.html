<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NeuralBox — Run any AI model in your browser</title>
  <meta name="description"
    content="A one-stop studio to run AI models entirely in your browser — object detection (YOLO), depth, segmentation, speech, translation, chat and more. No server, no sign-up, works on any device. Powered by WebGPU + WASM." />
  <meta name="theme-color" content="#070b11" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NeuralBox" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="app">
    <div class="boot">
      <div class="boot-logo">Neural<span>Box</span></div>
      <div class="boot-sub">Loading studio…</div>
    </div>
  </div>
  <script type="module" src="/src/studio/main.js"></script>

  <!-- PWA Install Prompt Banner -->
  <div id="pwa-install-prompt" style="display: none; position: fixed; left: 50%; bottom: max(1.25rem, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 9999; width: min(440px, calc(100% - 2rem)); flex-direction: column; background: rgba(10, 10, 18, 0.98); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; box-shadow: 0 16px 48px rgba(0,0,0,0.7), 0 0 40px rgba(16, 185, 129, 0.3); color: #fff; font-family: 'Manrope', sans-serif;">
    <!-- Default View -->
    <div id="pwa-view-default" style="display: flex; align-items: center; gap: 0.85rem; padding: 0.9rem 1rem; width: 100%;">
      <div style="width: 40px; height: 40px; border-radius: 10px; background: #10b981; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4M7 10l5 5 5-5M12 15V3"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-weight: 700; font-size: 0.95rem; color: #fff;">Install NeuralBox</div>
        <div id="pwa-desc" style="font-size: 0.78rem; color: #94a3b8;">Add to your home screen for instant, full-screen AI sandboxing.</div>
      </div>
      <button id="pwa-install-btn" style="background: #10b981; border: none; color: #fff; padding: 0.55rem 1rem; font-size: 0.85rem; border-radius: 10px; flex-shrink: 0; cursor: pointer; font-weight: 600; font-family: inherit; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);">Install</button>
      <button id="pwa-dismiss-btn" aria-label="Dismiss install prompt" style="background: transparent; border: none; color: #64748b; cursor: pointer; width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.2s;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    </div>
    
    <!-- iOS Guidance View -->
    <div id="pwa-view-ios" style="display: none; flex-direction: column; gap: 0.85rem; padding: 1.2rem 1.2rem; width: 100%;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.6rem;">
        <span style="font-weight: 700; font-size: 1rem; color: #fff;">Install on iPhone / iPad</span>
        <button id="pwa-ios-close-btn" style="background: transparent; border: none; color: #64748b; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 0.75rem; font-size: 0.88rem; color: #cbd5e1; line-height: 1.4;">
        <div style="display: flex; gap: 0.6rem; align-items: flex-start;">
          <div style="width: 22px; height: 22px; border-radius: 50%; background: #111827; border: 1px solid #10b981; color: #10b981; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; font-size: 0.75rem;">1</div>
          <div>
            Tap the <strong>Share</strong> button in Safari (looks like a square with an arrow pointing up <span style="display: inline-flex; padding: 2px 4px; background: rgba(255,255,255,0.08); border-radius: 4px; vertical-align: middle;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></span>).
          </div>
        </div>
        <div style="display: flex; gap: 0.6rem; align-items: flex-start;">
          <div style="width: 22px; height: 22px; border-radius: 50%; background: #111827; border: 1px solid #10b981; color: #10b981; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; font-size: 0.75rem;">2</div>
          <div>
            Scroll down the share sheet and select <strong>Add to Home Screen</strong> <span style="display: inline-flex; padding: 2px 4px; background: rgba(255,255,255,0.08); border-radius: 4px; vertical-align: middle; font-weight: 600;">+</span>.
          </div>
        </div>
      </div>
      <button id="pwa-ios-back-btn" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 0.55rem; font-size: 0.85rem; border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: 0.4rem; transition: background 0.2s;">Back</button>
    </div>
  </div>

  <script>
    (function() {
      const DISMISS_KEY = 'neuralbox_install_dismissed';
      if (localStorage.getItem(DISMISS_KEY) === '1') return;

      const isStandalone = () => window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
      if (isStandalone()) return;

      const isIOS = () => {
        const userAgent = window.navigator.userAgent.toLowerCase();
        const isIphone = /iphone|ipad|ipod/.test(userAgent);
        const isMacTouch = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        return isIphone || isMacTouch;
      };

      const promptEl = document.getElementById('pwa-install-prompt');
      const defaultView = document.getElementById('pwa-view-default');
      const iosView = document.getElementById('pwa-view-ios');
      
      const installBtn = document.getElementById('pwa-install-btn');
      const dismissBtn = document.getElementById('pwa-dismiss-btn');
      const descEl = document.getElementById('pwa-desc');
      
      const iosCloseBtn = document.getElementById('pwa-ios-close-btn');
      const iosBackBtn = document.getElementById('pwa-ios-back-btn');

      let deferredPrompt = null;
      let platform = null;

      if (isIOS()) {
        platform = 'ios';
        descEl.innerText = "Tap Share, then 'Add to Home Screen' for standalone access.";
        installBtn.innerText = "Guide";
        promptEl.style.display = 'flex';
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        platform = 'standard';
        promptEl.style.display = 'flex';
      });

      installBtn.addEventListener('click', async () => {
        if (platform === 'ios') {
          defaultView.style.display = 'none';
          iosView.style.display = 'flex';
          return;
        }
        if (!deferredPrompt) return;
        await deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch(err) {}
        promptEl.style.display = 'none';
        deferredPrompt = null;
      });

      const dismissPrompt = () => {
        promptEl.style.display = 'none';
        localStorage.setItem(DISMISS_KEY, '1');
      };

      dismissBtn.addEventListener('click', dismissPrompt);
      iosCloseBtn.addEventListener('click', dismissPrompt);

      iosBackBtn.addEventListener('click', () => {
        iosView.style.display = 'none';
        defaultView.style.display = 'flex';
      });

      window.addEventListener('appinstalled', () => {
        promptEl.style.display = 'none';
        deferredPrompt = null;
      });
      
      const style = document.createElement('style');
      style.innerText = `
        #pwa-install-prompt { animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideIn {
          0% { transform: translate(-50%, 30px); opacity: 0; }
          100% { transform: translate(-50%, 0); opacity: 1; }
        }
      `;
      document.head.appendChild(style);
    })();
  </script>
</body>

</html>
