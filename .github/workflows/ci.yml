name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (both pages + all studio chunks)
        run: npm run build

      - name: Node test suite (pure, no browser)
        run: |
          for t in test:stability test:rendering test:routing test:device \
                   test:trust test:composer test:generation test:events \
                   test:voice test:settings test:rag:helpers test:ascii-ui; do
            echo "--- npm run $t ---"
            npm run "$t"
          done

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Studio smoke (gallery, routing, mounts all studios)
        run: npm run test:studio
